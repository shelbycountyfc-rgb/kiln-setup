# pacman configuration of the live medium.
#
# multilib is enabled so the Software page can list and install 32-bit packages
# in the same run. The installed system gets the same section only when the user
# turns multilib on.

[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
