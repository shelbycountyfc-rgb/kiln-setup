name: build-iso

# Builds the bootable installer image and publishes it as a release asset.
#
# An ISO is a multi-hundred-megabyte artifact, so it is never committed: it is
# built on a runner and attached to a GitHub Release. Push a tag (v1.0.0) or run
# the workflow by hand, then download the image from the release page or from
# the run's artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update (e.g. v1.0.0). Empty: artifact only."
        required: false
        default: ""
      revision:
        description: "Revision suffix, e.g. 2 gives -r2. Empty: one higher than any image in out/."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  iso:
    name: Build the installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Optional: importing a signing key turns on the signature step below.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image in an Arch Linux container
        env:
          # The runner's out/ starts empty, so without this every hand-started
          # build would be named -r1.  Pass the number the build should carry.
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --privileged -e REVISION="${REVISION:-}" \
            -v "$PWD:/build" \
            -w /build \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              # mtools builds the EFI system partition image; without it mkarchiso
              # silently drops the UEFI boot mode and the ISO will not boot on UEFI.
              pacman -Sy --noconfirm --needed archiso mkinitcpio python mtools dosfstools
              args=( --out /build/out )
              if [[ -n "${REVISION:-}" ]]; then args+=( --revision "$REVISION" ); fi
              ./iso/build-iso.sh "${args[@]}"
            '

      - name: Verify the checksum
        run: |
          set -euo pipefail
          cd out
          ls -l
          sha256sum -c ./*.iso.sha256

      - name: Sign the checksum
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in out/*.iso.sha256; do
            gpg --batch --yes --armor --detach-sign "$file"
          done

      - name: Show what the image contains
        run: |
          set -euo pipefail
          image="$(ls out/*.iso | head -1)"
          xorriso -indev "$image" -report_el_torito plain | grep -i boot || true

      - name: Upload the image as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiln-setup-iso
          path: |
            out/*.iso
            out/*.iso.sha256
            out/*.iso.sha256.asc
          if-no-files-found: error
          retention-days: 30

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Kiln Setup ${{ inputs.release_tag || github.ref_name }}
          body: |
            Bootable installer image for Arch Linux, built by Kiln Setup, an unofficial project.

            Kiln Setup is not affiliated with, endorsed by, or supported by the Arch Linux project.

            Write it to a USB stick:
            ```
            sudo dd if=kiln-setup-*.iso of=/dev/sdX bs=4M status=progress oflag=sync
            ```
            or boot it in a virtual machine:
            ```
            qemu-system-x86_64 -enable-kvm -m 4096 \
              -bios /usr/share/edk2/x64/OVMF.4m.fd -cdrom kiln-setup-*.iso
            ```
            The installer starts by itself on tty1. Installing erases the selected disk.
          files: |
            out/*.iso
            out/*.iso.sha256
            out/*.iso.sha256.asc
          # The signature only exists when a signing key is configured, so a
          # missing .asc must not fail the release: without this a repository
          # with no GPG_PRIVATE_KEY never published anything at all.
          fail_on_unmatched_files: false

  smoke:
    name: Boot the image in QEMU
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Take the image from the build job
        uses: actions/download-artifact@v4
        with:
          name: kiln-setup-iso
          path: out

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Boot it on legacy BIOS
        run: |
          set -euo pipefail
          image="$(ls out/*.iso | head -1)"
          python3 tests/boot-smoke.py "$image" --wait 240

      - name: Boot it on UEFI
        run: |
          set -euo pipefail
          image="$(ls out/*.iso | head -1)"
          python3 tests/boot-smoke.py "$image" --uefi --wait 300
